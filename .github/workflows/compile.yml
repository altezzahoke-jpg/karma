name: Compile Arduino Sketch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Platform ESP32
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --export-binaries karma

      - name: Upload Binary Output
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3
          path: |
            karma/build/esp32.esp32.esp32c3/**/*.bin
            karma/build/esp32.esp32.esp32c3/**/*.hex
